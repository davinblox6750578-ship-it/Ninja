name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Achar pasta do projeto
        id: p
        run: |
          d=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n1)")
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient-jar
          path: ${{ steps.p.outputs.dir }}/build/libs/*.jar
